[project]
name = "goszakup-ai"
version = "0.1.0"
description = "AI agent for analysing Kazakhstan public procurement data (goszakup.gov.kz OWS v3)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "numpy>=2.5.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "tenacity>=9.2",
    "typer>=0.15",
]

[project.scripts]
goszakup = "goszakup_ai.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goszakup_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
