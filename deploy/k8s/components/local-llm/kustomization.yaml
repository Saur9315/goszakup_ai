apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - vllm.yaml
patches:
  - target:
      kind: ConfigMap
      name: goszakup-config
    patch: |-
      - op: replace
        path: /data/OPENAI_MODEL
        value: local-llm
      - op: add
        path: /data/OPENAI_BASE_URL
        value: http://vllm:8000/v1
