apiVersion: apps/v1
kind: Deployment
metadata:
  name: goszakup-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: goszakup-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goszakup-api
        goszakup/db-client: "true"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: goszakup-backend
          args: ["serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: goszakup-config
          env:
            # least-privilege DB role; the OWS token is deliberately not mounted here
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: goszakup-secrets, key: API_DATABASE_URL}}
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: goszakup-secrets, key: OPENAI_API_KEY}}
            - name: QWEN_API_KEY
              valueFrom: {secretKeyRef: {name: goszakup-secrets, key: QWEN_API_KEY}}
            - name: AUTH_SECRET
              valueFrom: {secretKeyRef: {name: goszakup-secrets, key: AUTH_SECRET, optional: true}}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: goszakup-api
spec:
  selector:
    app.kubernetes.io/name: goszakup-api
  ports:
    - port: 80
      targetPort: 8000
