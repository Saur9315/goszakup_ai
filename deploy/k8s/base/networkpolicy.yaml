apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-clients-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              goszakup/db-client: "true"
      ports:
        - port: 5432
