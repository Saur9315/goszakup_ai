apiVersion: batch/v1
kind: CronJob
metadata:
  name: goszakup-sync
spec:
  schedule: "0 */6 * * *"
  timeZone: Asia/Almaty
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: goszakup-sync
            goszakup/db-client: "true"
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
          containers:
            - name: sync
              image: goszakup-backend
              args: ["sync"]
              envFrom:
                - configMapRef:
                    name: goszakup-config
              env:
                - name: DATABASE_URL
                  valueFrom: {secretKeyRef: {name: goszakup-secrets, key: DATABASE_URL}}
                - name: OWS_TOKEN
                  valueFrom: {secretKeyRef: {name: goszakup-secrets, key: OWS_TOKEN}}
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {memory: 2Gi}
---
