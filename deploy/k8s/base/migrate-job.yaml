apiVersion: batch/v1
kind: Job
metadata:
  name: goszakup-migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goszakup-migrate
        goszakup/db-client: "true"
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: goszakup-backend
          args: ["db", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: goszakup-secrets, key: DATABASE_URL}}
            - name: API_DATABASE_URL
              valueFrom: {secretKeyRef: {name: goszakup-secrets, key: API_DATABASE_URL}}
