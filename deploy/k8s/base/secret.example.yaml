# Not applied by kustomize. Create the real secret from your .env:
#   kubectl -n goszakup create secret generic goszakup-secrets --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: goszakup-secrets
type: Opaque
stringData:
  POSTGRES_USER: goszakup
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: goszakup
  API_DB_PASSWORD: change-me-too
  DATABASE_URL: postgresql+asyncpg://goszakup:change-me@postgres:5432/goszakup
  API_DATABASE_URL: postgresql+asyncpg://goszakup_api_user:change-me-too@postgres:5432/goszakup
  OWS_TOKEN: ""
  OPENAI_API_KEY: ""
  QWEN_API_KEY: ""
  AUTH_SECRET: ""
