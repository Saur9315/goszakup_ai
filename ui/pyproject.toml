[project]
name = "goszakup-ui"
version = "0.1.0"
description = "Streamlit client for the GosZakup AI API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
